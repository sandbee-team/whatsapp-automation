<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WA Automation by Sandbee</title>
    <meta name="application-name" content="WA Automation by Sandbee" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!--
      Google Fonts for the token font stack (Instrument Sans + Noto Sans
      Devanagari, see packages/design-tokens's `--wp-font-ui`).
      `display=swap` avoids invisible text while the font loads; self-hosting
      these is a future optimisation, not required for P05.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    />
