# loki-config.yml (P25 Unit U4, step 5) - single-binary, filesystem-backed
# Loki for dev/small-fleet use. tsdb schema v13 is the currently
# recommended schema for new Loki installs; retention is enforced by the
# compactor (168h = 7 days), never by a cron deleting chunks by hand.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
