global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/rules/*.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'wp'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/wp.dev.json'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
        labels:
          role: redis-sig
